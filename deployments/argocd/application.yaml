apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tunnel-orchestrator
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  source:
    repoURL: https://github.com/your-org/tunnel-orchestrator.git
    targetRevision: main
    path: charts/tunnel-orchestrator
    helm:
      releaseName: tunnel-orchestrator
      valueFiles:
        - values.yaml
        - values.prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tunnel-orchestrator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: ["/spec/replicas"]   # HPA-managed
