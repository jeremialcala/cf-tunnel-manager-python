{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tunnel-orchestrator.componentName" (dict "root" . "component" "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tunnel-orchestrator.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tunnel-orchestrator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "tunnel-orchestrator.componentLabels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.config.observability.metricsPort }}"
        prometheus.io/path: "/metrics"
        {{- with .Values.api.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "tunnel-orchestrator.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      enableServiceLinks: false
      imagePullSecrets: {{- toYaml .Values.global.image.pullSecrets | nindent 8 }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      topologySpreadConstraints: {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      containers:
        - name: api
          image: {{ include "tunnel-orchestrator.image" (list . .Values.api) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { name: http,    containerPort: 8000 }
            - { name: metrics, containerPort: {{ .Values.config.observability.metricsPort }} }
          env:
            {{- include "tunnel-orchestrator.commonEnv" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health/live,  port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            failureThreshold: 30
            periodSeconds: 2
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "tunnel-orchestrator.commonVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "tunnel-orchestrator.commonVolumes" . | nindent 8 }}
{{- end }}
