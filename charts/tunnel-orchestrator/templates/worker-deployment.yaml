{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tunnel-orchestrator.componentName" (dict "root" . "component" "worker") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tunnel-orchestrator.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tunnel-orchestrator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "tunnel-orchestrator.componentLabels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.config.observability.metricsPort }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "tunnel-orchestrator.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ add .Values.config.resilience.sagaGlobalTimeoutSeconds 30 }}
      enableServiceLinks: false
      imagePullSecrets: {{- toYaml .Values.global.image.pullSecrets | nindent 8 }}
      topologySpreadConstraints: {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "tunnel-orchestrator.image" (list . .Values.worker) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { name: metrics, containerPort: {{ .Values.config.observability.metricsPort }} }
          env:
            {{- include "tunnel-orchestrator.commonEnv" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "tunnel-orchestrator.commonVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "tunnel-orchestrator.commonVolumes" . | nindent 8 }}
{{- end }}
