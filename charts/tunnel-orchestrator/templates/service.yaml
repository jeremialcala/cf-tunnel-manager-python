{{- if .Values.api.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tunnel-orchestrator.componentName" (dict "root" . "component" "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tunnel-orchestrator.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "tunnel-orchestrator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - { name: http,    port: {{ .Values.api.service.port }}, targetPort: http,    protocol: TCP }
    - { name: metrics, port: {{ .Values.config.observability.metricsPort }}, targetPort: metrics, protocol: TCP }
{{- end }}
