name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  id-token: write
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ----------------------------------------------------------- lint + types
  quality:
    name: lint + typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --frozen || uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy services apps shared platform

  # ----------------------------------------------------------- unit tests
  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - uses: actions/setup-python@v5
        with: 
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --frozen || uv sync --all-extras
      - run: uv run pytest -m "not integration and not e2e and not slow" --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ------------------------------------------------ contract tests (Avro <-> Pydantic)
  contract:
    name: contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with: 
          python-version: ${{ env.PYTHON_VERSION }} 
      - run: uv sync --all-extras --frozen || uv sync --all-extras
      - run: uv run pytest -m contract

  # ------------------------------------------------ integration (testcontainers)
  integration:
    name: integration tests
    runs-on: ubuntu-24.04
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with: 
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --frozen || uv sync --all-extras
      - run: uv run pytest -m integration --maxfail=1

  # ------------------------------------------------ helm lint + render
  helm:
    name: helm lint + template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.15.4 }
      - run: helm lint charts/tunnel-orchestrator
      - run: |
          helm template tunnel-orchestrator charts/tunnel-orchestrator \
            -f charts/tunnel-orchestrator/values.dev.yaml \
            > /tmp/render.yaml
      - uses: instrumenta/kubeval-action@v0.1.1
        with: { files: /tmp/render.yaml, ignore_missing_schemas: true }

  # ------------------------------------------------ container security scan
  scan:
    name: trivy scan
    runs-on: ubuntu-24.04
    needs: [quality]
    strategy:
      matrix:
        image: [api, worker, scheduler, dlq_processor]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.${{ matrix.image }}
          push: false
          tags: tunnel-orchestrator-${{ matrix.image }}:scan
          load: true
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: tunnel-orchestrator-${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: "trivy-${{ matrix.image }}.sarif" }

  # ------------------------------------------------ build + publish on main
  publish:
    name: build & push images
    runs-on: ubuntu-24.04
    needs: [quality, unit, contract, helm]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        image: [api, worker, scheduler, dlq_processor]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest
            type=ref,event=branch
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
