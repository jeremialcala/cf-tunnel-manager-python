# =====================================================================
# Local Prometheus — scrapes the orchestrator processes running on the
# host (default ports). Adjust if you run them inside docker-compose.
# =====================================================================
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: tunnel-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: { service: api }
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: tunnel-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels: { service: worker }

  - job_name: jaeger
    metrics_path: /metrics
    static_configs:
      - targets: ["jaeger:14269"]
        labels: { service: jaeger }
