# =====================================================================
# Tunnel Orchestrator — local development stack
# =====================================================================
# Default `make up`  →   Kafka + Schema Registry + Kafka UI + PG + Redis
#                        + Jaeger (OTLP backend, much simpler than SigNoz
#                        for a local box).
#
# Heavy SigNoz stack is opt-in via the `signoz` profile:
#     docker compose --profile signoz up -d
#
# Usage:
#   make up        # start the default stack
#   make logs      # tail
#   make down      # stop, keep volumes
#   make destroy   # stop AND drop volumes
# =====================================================================

name: tunnel-orchestrator

x-restart-policy: &restart_policy
  restart: unless-stopped

services:

  # =================================================================
  # Apache Kafka (KRaft mode, single broker for local dev)
  # =================================================================
  kafka:
    <<: *restart_policy
    image: confluentinc/cp-kafka:7.7.1
    container_name: tunnel-kafka
    ports:
      - "9092:9092"           # external (host)
      - "29092:29092"         # internal (docker network)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      # Bind on all interfaces; advertise the appropriate hostname per listener.
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: 12
      # KRaft requires a stable cluster id; arbitrary 22-char base64.
      CLUSTER_ID: 'q1Sh-9_ISia_zwGINzRvyQ'
    healthcheck:
      # Use 0.0.0.0 / localhost works because we now bind on all interfaces.
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 45s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # =================================================================
  # Confluent Schema Registry (Avro)
  # =================================================================
  schema-registry:
    <<: *restart_policy
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: tunnel-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  # =================================================================
  # Kafka UI (developer convenience)
  # =================================================================
  kafka-ui:
    <<: *restart_policy
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: tunnel-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # =================================================================
  # PostgreSQL 16
  # =================================================================
  postgres:
    <<: *restart_policy
    image: postgres:16-alpine
    container_name: tunnel-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tunnel
      POSTGRES_PASSWORD: tunnel
      POSTGRES_DB: tunnel_orchestrator
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunnel -d tunnel_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro

  # =================================================================
  # Redis 7
  # =================================================================
  redis:
    <<: *restart_policy
    image: redis:7-alpine
    container_name: tunnel-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  # =================================================================
  # Jaeger all-in-one — OTLP backend for local dev
  # =================================================================
  # Single container, exposes:
  #   * 4317  OTLP gRPC      (matches OTEL_EXPORTER_OTLP_ENDPOINT)
  #   * 4318  OTLP HTTP
  #   * 16686 Jaeger UI
  # Replaces the previous SigNoz stack which is heavy and requires
  # schema migrations to be useful. SigNoz is still available via the
  # opt-in `signoz` profile below.
  # =================================================================
  jaeger:
    <<: *restart_policy
    image: jaegertracing/all-in-one:1.60
    container_name: tunnel-jaeger
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      LOG_LEVEL: "warn"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # =================================================================
  # Prometheus (optional metrics scrape) — included by default,
  # picks up /metrics from any service started against the host.
  # =================================================================
  prometheus:
    <<: *restart_policy
    image: prom/prometheus:v2.55.0
    container_name: tunnel-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # =================================================================
  # SigNoz stack — opt-in only (`docker compose --profile signoz up`)
  # =================================================================
  signoz-clickhouse:
    <<: *restart_policy
    image: clickhouse/clickhouse-server:24.1.2-alpine
    container_name: tunnel-signoz-ch
    profiles: [signoz]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - signoz-clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  signoz-collector:
    <<: *restart_policy
    image: signoz/signoz-otel-collector:0.111.20
    container_name: tunnel-signoz-collector
    profiles: [signoz]
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./scripts/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "14317:4317"   # avoid conflict with Jaeger on :4317
      - "14318:4318"

  signoz-query:
    <<: *restart_policy
    image: signoz/query-service:0.55.0
    container_name: tunnel-signoz-query
    profiles: [signoz]
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    environment:
      ClickHouseUrl: tcp://signoz-clickhouse:9000
      STORAGE: clickhouse
      GODEBUG: netdns=go
    ports:
      - "8082:8080"

  signoz-frontend:
    <<: *restart_policy
    image: signoz/frontend:0.55.0
    container_name: tunnel-signoz-ui
    profiles: [signoz]
    depends_on:
      - signoz-query
    ports:
      - "3301:3301"

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  prometheus-data:
  signoz-clickhouse:

networks:
  default:
    name: tunnel-orchestrator-net
