# =====================================================================
# Tunnel Orchestrator — local development stack
# =====================================================================
# Provides Apache Kafka (KRaft mode), Schema Registry, PostgreSQL,
# Redis and SigNoz (OTel backend) for local end-to-end work.
#
# Usage:
#   make up        # start
#   make logs      # tail
#   make down      # stop, keep volumes
#   make destroy   # stop AND drop volumes
# =====================================================================

name: tunnel-orchestrator

x-restart-policy: &restart_policy
  restart: unless-stopped

services:

  # -----------------------------------------------------------------
  # Apache Kafka (KRaft mode, single broker for local dev)
  # -----------------------------------------------------------------
  kafka:
    <<: *restart_policy
    image: confluentinc/cp-kafka:7.7.1
    container_name: tunnel-kafka
    ports:
      - "9092:9092"           # external (host)
      - "29092:29092"         # internal (docker network)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: 12
      CLUSTER_ID: 'q1Sh-9_ISia_zwGINzRvyQ'
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # -----------------------------------------------------------------
  # Confluent Schema Registry (Avro)
  # -----------------------------------------------------------------
  schema-registry:
    <<: *restart_policy
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: tunnel-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 12

  # -----------------------------------------------------------------
  # Kafka UI (developer convenience)
  # -----------------------------------------------------------------
  kafka-ui:
    <<: *restart_policy
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: tunnel-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # -----------------------------------------------------------------
  # PostgreSQL 16
  # -----------------------------------------------------------------
  postgres:
    <<: *restart_policy
    image: postgres:16-alpine
    container_name: tunnel-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tunnel
      POSTGRES_PASSWORD: tunnel
      POSTGRES_DB: tunnel_orchestrator
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunnel -d tunnel_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro

  # -----------------------------------------------------------------
  # Redis 7
  # -----------------------------------------------------------------
  redis:
    <<: *restart_policy
    image: redis:7-alpine
    container_name: tunnel-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  # -----------------------------------------------------------------
  # SigNoz (OTel backend) — minimal single-node setup
  # -----------------------------------------------------------------
  signoz-clickhouse:
    <<: *restart_policy
    image: clickhouse/clickhouse-server:24.1.2-alpine
    container_name: tunnel-signoz-ch
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - signoz-clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  signoz-collector:
    <<: *restart_policy
    image: signoz/signoz-otel-collector:0.111.20
    container_name: tunnel-signoz-collector
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./scripts/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  signoz-query:
    <<: *restart_policy
    image: signoz/query-service:0.55.0
    container_name: tunnel-signoz-query
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    environment:
      ClickHouseUrl: tcp://signoz-clickhouse:9000
      STORAGE: clickhouse
      GODEBUG: netdns=go
    ports:
      - "8082:8080"

  signoz-frontend:
    <<: *restart_policy
    image: signoz/frontend:0.55.0
    container_name: tunnel-signoz-ui
    depends_on:
      - signoz-query
    ports:
      - "3301:3301"

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  signoz-clickhouse:

networks:
  default:
    name: tunnel-orchestrator-net
